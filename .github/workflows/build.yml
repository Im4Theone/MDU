name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Type-check frontend
        working-directory: web
        run: npm run check

      # Runs the real application on the runner's desktop: docks, WebView2,
      # clicking an item, rejecting bad messages, wallpaper apply/restore.
      - name: Runtime self-test
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'mdu-self-test'
          $data = Join-Path $out 'data'
          New-Item -ItemType Directory -Force $data | Out-Null

          # A synthetic portrait wallpaper (the real artwork is not in the repository).
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 600, 750
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(168, 168, 168))
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(134, 168, 60))
          $graphics.FillEllipse($brush, 150, 100, 300, 400)
          $graphics.Dispose()
          $wallpaper = Join-Path $data 'test-wallpaper.png'
          $bitmap.Save($wallpaper, [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()

          @{ startWithWindows = $false; wallpaper = @{ enabled = $true; image = $wallpaper } } |
            ConvertTo-Json | Set-Content -Path (Join-Path $data 'config.json') -Encoding utf8NoBOM

          $report = Join-Path $out 'report.json'
          $process = Start-Process -FilePath 'build\windows\Release\mdu.exe' -PassThru `
            -ArgumentList @('--self-test', "`"$report`"", '--data-dir', "`"$data`"")
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            Write-Error 'mdu.exe did not exit within 120 seconds'
          }
          Copy-Item (Join-Path $data 'logs\mdu.log') $out -ErrorAction SilentlyContinue

          if (Test-Path $report) {
            $result = Get-Content $report -Raw | ConvertFrom-Json
            foreach ($check in $result.checks) {
              $mark = if ($check.passed) { 'PASS' } else { 'FAIL' }
              Write-Output ("{0}  {1}  {2}" -f $mark, $check.name, $check.detail)
            }
          } else {
            Write-Output 'No report was written.'
          }
          Write-Output '--- mdu.log ---'
          Get-Content (Join-Path $out 'mdu.log') -ErrorAction SilentlyContinue
          exit $process.ExitCode

      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdu-self-test
          path: |
            ${{ runner.temp }}/mdu-self-test/*.json
            ${{ runner.temp }}/mdu-self-test/*.png
            ${{ runner.temp }}/mdu-self-test/mdu.log
          if-no-files-found: warn

      - name: Upload build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mdu-windows-x64
          path: |
            build/windows/Release/mdu.exe
            build/windows/Release/web/
            build/windows/Release/themes/
            LICENSE
          if-no-files-found: error

      - name: Build installer
        shell: pwsh
        run: |
          cmake --install build/windows --config Release --prefix staging
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $candidates = @(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $candidates) { throw 'Inno Setup (ISCC.exe) is not installed on this runner' }
          $iscc = $candidates[0]
          Write-Output ("Using {0} ({1})" -f $iscc, (Get-Item $iscc).VersionInfo.ProductVersion)
          & $iscc "/DSourceDir=$PWD\staging" "/DAppVersion=$version" "/O$PWD\installer-out" installer\mdu.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # Installs for the current user, verifies the result, runs the self-test
      # from the installed copy, then uninstalls and verifies the cleanup.
      - name: Installer test
        shell: pwsh
        run: |
          function Check([bool]$condition, [string]$message) {
            if ($condition) { Write-Output "PASS  $message" } else { Write-Output "FAIL  $message"; $script:failed = $true }
          }
          $failed = $false
          $setup = (Get-ChildItem installer-out\MDU-Setup-*.exe)[0].FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs\MDU'
          $data = Join-Path $env:LOCALAPPDATA 'MDU'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startup' -PassThru -Wait
          Check ($install.ExitCode -eq 0) "installer exit code $($install.ExitCode)"
          foreach ($file in 'mdu.exe', 'unins000.exe', 'LICENSE', 'web\index.html', 'web\settings.html', 'web\scripts\dock.js', 'web\scripts\settings.js', 'web\styles\dock.css', 'themes\miku\theme.json') {
            Check (Test-Path (Join-Path $app $file)) "installed $file"
          }
          Check (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MDU.lnk") 'Start menu shortcut'
          $run = (Get-ItemProperty $runKey -Name MDU -ErrorAction SilentlyContinue).MDU
          Check ($run -like "*$app\mdu.exe*") "startup entry: $run"
          $config = Get-Content (Join-Path $data 'config.json') -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          Check ($config.startWithWindows -eq $true) 'settings file records start with Windows'

          $testDir = Join-Path $env:RUNNER_TEMP 'mdu-installed-test'
          New-Item -ItemType Directory -Force $testDir | Out-Null
          $selfTest = Start-Process (Join-Path $app 'mdu.exe') -PassThru `
            -ArgumentList @('--self-test', "`"$testDir\report.json`"", '--data-dir', "`"$testDir\data`"")
          if (-not $selfTest.WaitForExit(120000)) { $selfTest.Kill() }
          Check ($selfTest.ExitCode -eq 0) "self-test of the installed copy (exit code $($selfTest.ExitCode))"

          Start-Process (Join-Path $app 'mdu.exe') | Out-Null
          Start-Sleep -Seconds 5
          Check ($null -ne (Get-Process mdu -ErrorAction SilentlyContinue)) 'MDU running before uninstall'

          Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' | Out-Null
          # The uninstaller hands over to a temporary copy, so wait for the result.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          Check (-not (Test-Path $app)) 'install folder removed'
          Check ($null -eq (Get-Process mdu -ErrorAction SilentlyContinue)) 'MDU stopped by the uninstaller'
          Check ($null -eq (Get-ItemProperty $runKey -Name MDU -ErrorAction SilentlyContinue)) 'startup entry removed'
          Check (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MDU.lnk")) 'Start menu shortcut removed'
          foreach ($folder in 'cache', 'logs', 'state', 'WebView2') {
            Check (-not (Test-Path (Join-Path $data $folder))) "data\$folder removed"
          }
          Check (Test-Path (Join-Path $data 'config.json')) 'settings kept after a silent uninstall'
          if ($failed) { exit 1 }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mdu-setup
          path: installer-out/MDU-Setup-*.exe
          if-no-files-found: error

  core:
    name: Portable core (Linux, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset core-tests
      - name: Build
        run: cmake --build --preset core-tests --parallel
      - name: Test
        run: ctest --preset core-tests
